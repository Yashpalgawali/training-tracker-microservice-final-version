services:
  trainingtrackerdb:
    image: mysql
    container_name: trainingtrackerdb
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: trainingtrackerdb
    extends:
      file: common-config.yml
      service: microservice-database-config

  rabbit:
    image: rabbitmq:3.12-management
    container_name: "rabbitmq"
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      retries: 5
      timeout: 10s
      interval: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "yashpalgawali/configserver:v5"
    container_name: "configserver-ms"
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: "yashpalgawali/eurekaserver:v5"
    container_name: "eurekaserver-ms"
    ports:
      - "8070:8070"
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  company:
    image: "yashpalgawali/company:v5"
    container_name: "company-ms"
    ports:
      - "7170:7170"
    depends_on:
      trainingtrackerdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --silent --fail http://localhost:7170/actuator/health | grep UP || exit 1"
      timeout: 5s
      interval: 5s
      retries: 15
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "company"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

