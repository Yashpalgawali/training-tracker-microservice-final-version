services:
  trainingtrackerdb:
    image: mysql
    container_name: trainingtrackerdb
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: trainingtrackerdb
    extends:
      file: common-config.yml
      service: microservice-database-config

  rabbit:
    image: rabbitmq:3.12-management
    container_name: "rabbitmq"
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      retries: 5
      timeout: 10s
      interval: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "yashpalgawali/configserver:v5"
    container_name: "configserver-ms"
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  company:
    image: "yashpalgawali/company:v5"
    container_name: "company-ms"
    ports:
      - "7170:7170"
    depends_on:
      trainingtrackerdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "company"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  department:
    image: "yashpalgawali/department:v5"
    container_name: "department-ms"
    ports:
      - "7270:7270"
    depends_on:
      trainingtrackerdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: department      
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  designation:
    image: "yashpalgawali/designation:v5"
    container_name: "designation-ms"
    ports:
      - "7370:7370"
    depends_on:
      trainingtrackerdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: designation
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  committee:
    image: "yashpalgawali/committee:v5"
    container_name: "committee-ms"
    ports:
      - "7470:7470"
    depends_on:
      trainingtrackerdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "committee"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks: 
  trainingtracker:
    driver: "bridge"