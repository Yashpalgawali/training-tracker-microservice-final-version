server:
  port: 7170
spring:
  application:
    name: company
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3399/trainingtrackerdb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  config:
    import: "optional:configserver:http://localhost:8071/"
  rabbitmq:
    port: 5672
    host: "localhost"
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
