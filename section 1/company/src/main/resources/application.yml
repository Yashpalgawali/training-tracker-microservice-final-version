#        step: 10s
#  metrics:
#    tags:
#      application: ${spring.application.name}

  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

logging:
  level:
    com:
      example:
        demo:
          company: debug
  pattern:
    level: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) %magenta([traceId=%X{traceId:-},spanId=%X{spanId:-}]) - %cyan(%msg%n)}"

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      permitted-number-of-calls-in-half-open-state: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10000

resilience4j.ratelimiter:
  configs:
    default:
      timeout-duration: 1000
      limit-for-period: 1
      limit-refresh-period: 5000
      