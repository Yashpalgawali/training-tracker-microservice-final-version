server:
  port: 7170
spring:
  application:
    name: company
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3399/trainingtrackerdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  config:
    import: "optional:configserver:http://localhost:8071/"
  rabbitmq:
    port: 5672
    host: "localhost"
    username: guest
    password: guest

eureka:
 instance:
   prefer-ip-address: true
 client:
   fetch-registry: true
   register-with-eureka: true
   service-url:
     defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: ${spring.application.name}
    description: "Training Tracker Company Application"
    version: "1.0.0"

management:
#  opentelemetry:
